<!DOCTYPE html>
<html>
<head>
<style>
.flip-container {
  perspective: 1000px;
  cursor: pointer;
}
.flipper {
  transition: 0.6s;
  transform-style: preserve-3d;
  position: relative;
}
.front, .back {
  backface-visibility: hidden;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
}
.front {
  z-index: 2;
  transform: rotateY(0deg);
}
.back {
  transform: rotateY(180deg);
}
.flip-container.flipped .flipper {
  transform: rotateY(180deg);
}
</style>
</head>
<body>
</body>
</html>
